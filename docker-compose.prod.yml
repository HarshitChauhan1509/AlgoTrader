services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stock-platform-postgres
    environment:
      POSTGRES_DB: stock_platform
      POSTGRES_USER: stock_platform
      POSTGRES_PASSWORD: stock_platform_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_platform -d stock_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stock-platform-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: stock-platform-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://stock_platform:stock_platform_password@postgres:5432/stock_platform
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=your_super_secret_access_key_for_prod
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key_for_prod
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: stock-platform-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # In production, web connects to the API via standard browser fetches (so localhost works if running locally, otherwise public IP)
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
