packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

nodeLinker: hoisted
strictPeerDependencies: false

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "argon2"
  - "prisma"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  prisma: true
